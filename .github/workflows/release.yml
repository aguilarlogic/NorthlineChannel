name: release

# Builds, validates, signs and packages a Windows release when a version tag (v*) is pushed.
# Signing steps run only when the corresponding secrets are configured (see docs/RELEASE.md);
# without them the workflow still produces unsigned artefacts for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  JUCE_TAG: "9.0.3"
  PLUGINVAL_VERSION: "v1.0.4"

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-latest
    env:
      NL_SIGN_MODE: ${{ secrets.NL_SIGN_MODE }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch JUCE and clap-juce-extensions
        shell: bash
        run: |
          git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE external/JUCE
          git clone --depth 1 --recursive https://github.com/free-audio/clap-juce-extensions external/clap-juce-extensions
      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release --target NorthlineChannel_All NorthlineTool -- -m
      - name: Tests (x64 only)
        if: matrix.arch == 'x64'
        run: build\NorthlineTool_artefacts\Release\NorthlineTool.exe test
      - name: pluginval (x64 only)
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          7z x pluginval.zip -opluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            --validate "build/NorthlineChannel_artefacts/Release/VST3/Northline Channel.vst3"
      - name: Sign binaries
        if: env.NL_SIGN_MODE != ''
        env:
          NL_CERT_SHA1: ${{ secrets.NL_CERT_SHA1 }}
          NL_AZURE_DLIB: ${{ secrets.NL_AZURE_DLIB }}
          NL_AZURE_METADATA: ${{ secrets.NL_AZURE_METADATA }}
        shell: pwsh
        run: |
          $bins = Get-ChildItem -Recurse build\NorthlineChannel_artefacts\Release -Include *.vst3,*.clap,*.exe -File | ForEach-Object FullName
          ./packaging/windows/sign.ps1 -Paths $bins
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $arch = if ("${{ matrix.arch }}" -eq "ARM64") { "arm64" } else { "x64" }
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DAppVersion=$version" "/DArch=$arch" `
            "/DArtefacts=..\..\build\NorthlineChannel_artefacts\Release" packaging\windows\NorthlineChannel.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*
            pluginval-logs/*

  release:
    # Publishes whatever architectures built: a failed ARM64 job leaves its download out
    # instead of blocking the others. Tags with a hyphen (v1.1.0-beta.1) are marked as pre-releases.
    needs: [windows]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Checksums
        run: |
          find artefacts -type f -name '*.exe' -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "No installers were built"; exit 1; }
      - name: Release notes
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            echo "Northline Channel $V: a channel strip plug-in (PRE, GATE, DE-ESS, EQ, COMP and a master section)."
            echo "Changes: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
            echo "Manual: [docs/manual](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/manual/index.md)."
            echo ""
            echo "## Install"
            echo ""
            echo "Windows only (x64 or ARM64). Run \`NorthlineChannel-$V-win-<arch>.exe\`. It installs the VST3 to"
            echo "  \`C:\\Program Files\\Common Files\\VST3\`, the CLAP to \`C:\\Program Files\\Common Files\\CLAP\` and the standalone app."
            echo "  The installer is not code-signed, so SmartScreen may say \"Windows protected your PC\":"
            echo "  choose **More info**, then **Run anyway**."
            echo ""
            echo "Then rescan plug-ins in your host. \`SHA256SUMS.txt\` lists the installer checksums."
            echo ""
            echo "Licensed under the GNU AGPLv3. Third-party licences are in THIRD_PARTY_NOTICES.md."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Northline Channel ${{ github.ref_name }}
          body_path: notes.md
          files: |
            artefacts/**/*.exe
            SHA256SUMS.txt
