name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

env:
  JUCE_TAG: "9.0.3"
  PLUGINVAL_VERSION: "v1.0.4"

jobs:
  windows:
    name: Windows (MSVC, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE external/JUCE

      - name: Configure
        shell: bash
        run: cmake -S . -B build -A x64

      - name: Build VST3 and NorthlineTool
        shell: bash
        run: cmake --build build --config Release --parallel --target NorthlineChannel_VST3 NorthlineTool

      - name: Run tests
        shell: bash
        run: build/NorthlineTool_artefacts/Release/NorthlineTool.exe test

      # In-process validator on the built VST3 (roadmap 11.2): exit code 1 on any FAIL.
      - name: Validate (NorthlineTool validate)
        shell: bash
        run: build/NorthlineTool_artefacts/Release/NorthlineTool.exe validate "build/NorthlineChannel_artefacts/Release/VST3/Northline Channel.vst3"

      # Mirrors release.yml (Windows, x64): pluginval at strictness 10, in process.
      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_Windows.zip"
          7z x pluginval.zip -opluginval
          ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs \
            --validate "build/NorthlineChannel_artefacts/Release/VST3/Northline Channel.vst3"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/NorthlineChannel_artefacts/Release/VST3/
            build/NorthlineTool_artefacts/Release/NorthlineTool.exe
            pluginval-logs/
          if-no-files-found: warn

  macos:
    # Not verified on macOS yet: a failure here must not block the pipeline.
    name: macOS (Xcode, VST3 + AU)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE
        shell: bash
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE external/JUCE

      - name: Configure
        run: cmake -S . -B build -G Xcode

      - name: Build VST3 and AU
        run: cmake --build build --config Release --parallel --target NorthlineChannel_VST3 NorthlineChannel_AU

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-vst3-au
          path: build/NorthlineChannel_artefacts/Release/
          if-no-files-found: warn
